<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mark Website</title>
  <meta name="description" content="A private little album of pictures, videos, songs and love messages.">
  <meta name="theme-color" content="#242120">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c99483' d='M12 21s-8-5.2-9.6-10.3C1.3 7.4 3.2 4.5 6.3 4.5c2 0 3.5 1 4.5 2.6l1.2 1.6 1.2-1.6c1-1.6 2.5-2.6 4.5-2.6 3.1 0 5 2.9 3.9 6.2C20 15.8 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16z" fill="currentColor"/><path d="M5 19V5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4z" fill="currentColor"/><path d="M19 5v14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
</svg>

<!-- Loading splash -->
<div id="splash" aria-hidden="true"><svg class="ic splash-heart"><use href="#i-heart"/></svg></div>

<!-- ============================== LOGIN ============================== -->
<main id="login-view" hidden>
  <div class="floaties" aria-hidden="true"></div>
  <section class="login-card">
    <div class="login-mark"><svg class="ic"><use href="#i-heart"/></svg></div>
    <h1 class="login-title" data-t="login.title">Mark Website</h1>

    <form id="login-form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field-label" data-t="login.userLabel">Username</span>
        <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label" data-t="login.passLabel">Password</span>
        <span class="pw-wrap">
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false"><svg class="ic"><use href="#i-eye"/></svg></button>
        </span>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn"><span data-t="login.button">Enter</span></button>
    </form>
  </section>
</main>

<!-- =============================== APP =============================== -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><svg class="ic brand-heart"><use href="#i-heart"/></svg><span data-t="header.brand">Mark Website</span></div>
      <div class="topbar-actions">
        <span class="user-chip" id="user-chip"><span class="avatar" id="user-avatar">M</span><span class="user-meta"><b id="user-name">Mark</b><small id="user-role">View only</small></span></span>
        <button type="button" class="btn btn-ghost admin-only" id="btn-edit" aria-pressed="false"><svg class="ic"><use href="#i-pencil"/></svg><span>Edit Text</span></button>
        <button type="button" class="btn btn-ghost" id="btn-logout"><svg class="ic"><use href="#i-logout"/></svg><span>Logout</span></button>
      </div>
    </div>
  </header>

  <div id="editbar" class="editbar" hidden>
    <div class="editbar-inner">
      <span class="editbar-msg"><svg class="ic"><use href="#i-pencil"/></svg> Edit mode · tap a highlighted text <em id="save-state" class="save-state" aria-live="polite"></em></span>
      <span class="editbar-actions">
        <button type="button" class="btn btn-small" id="btn-login-texts"><svg class="ic"><use href="#i-settings"/></svg>Login page texts</button>
        <button type="button" class="btn btn-small" id="btn-reset-texts">Reset all</button>
        <button type="button" class="btn btn-small btn-primary" id="btn-done"><svg class="ic"><use href="#i-check"/></svg>Done</button>
      </span>
    </div>
  </div>

  <section class="hero">
    <h1 class="hero-title" data-t="hero.title">Our Memory Album</h1>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Album sections">
    <div class="tab" role="tab" id="tab-pictures" data-tab="pictures" aria-controls="panel-pictures" tabindex="0"><svg class="ic"><use href="#i-image"/></svg><span class="tab-label" data-t="tab.pictures">Pictures</span><span class="count" id="count-pictures">0</span></div>
    <div class="tab" role="tab" id="tab-videos" data-tab="videos" aria-controls="panel-videos" tabindex="-1"><svg class="ic"><use href="#i-video"/></svg><span class="tab-label" data-t="tab.videos">Videos</span><span class="count" id="count-videos">0</span></div>
    <div class="tab" role="tab" id="tab-music" data-tab="music" aria-controls="panel-music" tabindex="-1"><svg class="ic"><use href="#i-music"/></svg><span class="tab-label" data-t="tab.music">Music</span><span class="count" id="count-music">0</span></div>
    <div class="tab" role="tab" id="tab-messages" data-tab="messages" aria-controls="panel-messages" tabindex="-1"><svg class="ic"><use href="#i-mail"/></svg><span class="tab-label" data-t="tab.messages">Love Messages</span><span class="count" id="count-messages">0</span></div>
  </nav>

  <main class="panels">
    <div id="load-error" class="notice" role="alert" hidden></div>

    <section class="panel" id="panel-pictures" role="tabpanel" aria-labelledby="tab-pictures" hidden>
      <div class="panel-head">
        <h2 data-t="sec.pictures.title">Our Pictures</h2>
        <button type="button" class="btn btn-primary admin-only" data-add="pictures"><svg class="ic"><use href="#i-plus"/></svg><span>Add Picture</span></button>
      </div>
      <div id="list-pictures" class="masonry"></div>
    </section>

    <section class="panel" id="panel-videos" role="tabpanel" aria-labelledby="tab-videos" hidden>
      <div class="panel-head">
        <h2 data-t="sec.videos.title">Our Videos</h2>
        <button type="button" class="btn btn-primary admin-only" data-add="videos"><svg class="ic"><use href="#i-plus"/></svg><span>Add Video</span></button>
      </div>
      <div id="list-videos" class="vgrid"></div>
    </section>

    <section class="panel" id="panel-music" role="tabpanel" aria-labelledby="tab-music" hidden>
      <div class="panel-head">
        <h2 data-t="sec.music.title">Our Songs</h2>
        <button type="button" class="btn btn-primary admin-only" data-add="music"><svg class="ic"><use href="#i-plus"/></svg><span>Add Song</span></button>
      </div>
      <div class="player" id="player">
        <div class="player-art" id="player-art" aria-hidden="true"><svg class="ic"><use href="#i-music"/></svg></div>
        <div class="player-body">
          <div class="player-info">
            <div class="player-title" id="player-title" data-t="music.idle">Pick a song to begin</div>
            <div class="player-artist" id="player-artist"></div>
          </div>
          <div class="player-seek">
            <span id="p-cur">0:00</span>
            <input type="range" id="p-seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
            <span id="p-dur">0:00</span>
          </div>
          <div class="player-controls">
            <button type="button" class="icon-btn" id="p-prev" aria-label="Previous song"><svg class="ic"><use href="#i-prev"/></svg></button>
            <button type="button" class="icon-btn play-btn" id="p-play" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
            <button type="button" class="icon-btn" id="p-next" aria-label="Next song"><svg class="ic"><use href="#i-next"/></svg></button>
            <span class="vol"><svg class="ic"><use href="#i-volume"/></svg><input type="range" id="p-vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></span>
          </div>
        </div>
      </div>
      <div id="list-music" class="playlist"></div>
    </section>

    <section class="panel" id="panel-messages" role="tabpanel" aria-labelledby="tab-messages" hidden>
      <div class="panel-head">
        <h2 data-t="sec.messages.title">Love Messages</h2>
        <button type="button" class="btn btn-primary admin-only" data-add="messages"><svg class="ic"><use href="#i-plus"/></svg><span>Write Message</span></button>
      </div>
      <div id="list-messages" class="letters"></div>
    </section>
  </main>
</div>

<!-- Mini player (shown when music plays on another tab) -->
<div id="mini" class="mini" hidden>
  <button type="button" class="mini-info" id="mini-open" aria-label="Open music"><svg class="ic"><use href="#i-music"/></svg><span id="mini-title"></span></button>
  <button type="button" class="icon-btn" id="mini-play" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
  <button type="button" class="icon-btn" id="mini-stop" aria-label="Stop"><svg class="ic"><use href="#i-x"/></svg></button>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
